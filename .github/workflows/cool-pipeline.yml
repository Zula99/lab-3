name : Lab 3 create artifact
on:
   push:
       branches:
       - main

   pull_requests:
       branches:
       - main

jobs:
   test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/checkout@v4
